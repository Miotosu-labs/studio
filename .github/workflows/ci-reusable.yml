name: CI (reusable)

on:
  workflow_call:
    inputs:
      preview_url:
        description: Vercel preview URL, passed when triggered by deployment_status
        required: false
        type: string
      package-manager:
        description: "Package manager: npm or pnpm"
        required: false
        type: string
        default: npm
      build-dir:
        description: Build output directory to validate
        required: false
        type: string
        default: dist
      scan-dir:
        description: Directory to scan for leaked secrets (defaults to build-dir)
        required: false
        type: string
        default: ""
      build-env:
        description: "Newline-separated KEY=dummy pairs exported before the build step"
        required: false
        type: string
        default: ""
      allowed-deps:
        description: "Comma- or space-separated runtime dependencies this product may use. Empty means none."
        required: false
        type: string
        default: ""

jobs:
  gate-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce conventional PR title
        if: github.event.pull_request.title != ''
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|docs|chore|refactor|test|perf)(\([a-z0-9-]+(,[a-z0-9-]+)*\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::Bad PR title: \"$PR_TITLE\""
            echo "Expected: type(scope): summary"
            echo "Types: feat, fix, docs, chore, refactor, test, perf"
            echo "Example: feat(web): add portfolio comparison view"
            exit 1
          fi
      - name: Refuse PRs that mix protected paths with product code
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 || true
          PROTECTED='^(\.github/|e2e/|supabase/policies/|supabase/tests/|CODEOWNERS$|perf-budget\.json$|AGENTS\.md$)'
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"; echo "$CHANGED"
          P=$(echo "$CHANGED" | grep -E "$PROTECTED" || true)
          O=$(echo "$CHANGED" | grep -vE "$PROTECTED" || true)
          if [ -n "$P" ] && [ -n "$O" ]; then
            echo "::error::This PR changes gate files and product code together. Split it."
            echo "Gate files:"; echo "$P"
            exit 1
          fi
      - name: Refuse source changes that carry no test
        if: github.event.pull_request.number != ''
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          TESTRE='(\.|-)(test|spec)\.[cm]?[tj]sx?$|(^|/)(__tests__|tests?)/'
          CODERE='^src/.*\.[cm]?[tj]sx?$'
          EXEMPTRE='\.d\.ts$|(^|/)types\.ts$'
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          CODE=$(echo "$CHANGED" | grep -E "$CODERE" | grep -vE "$TESTRE" | grep -vE "$EXEMPTRE" || true)
          TESTS=$(echo "$CHANGED" | grep -E "$TESTRE" || true)
          if [ -n "$CODE" ] && [ -z "$TESTS" ]; then
            echo "::error::This PR changes source files and adds no test. Write a test for the behaviour you changed."
            echo "Source files changed:"; echo "$CODE" | sed 's/^/    /'
            echo "Exempt: *.d.ts and types.ts"
            exit 1
          fi
          echo "OK: source changes carry test changes."
      - name: Refuse source changes that leave the repository with no tests
        if: github.event.pull_request.number != ''
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          TESTRE='(\.|-)(test|spec)\.[cm]?[tj]sx?$|(^|/)(__tests__|tests?)/'
          CODERE='^src/.*\.[cm]?[tj]sx?$'
          EXEMPTRE='\.d\.ts$|(^|/)types\.ts$'
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          CODE=$(echo "$CHANGED" | grep -E "$CODERE" | grep -vE "$TESTRE" | grep -vE "$EXEMPTRE" || true)
          if [ -z "$CODE" ]; then
            echo "OK: this PR changes no source files, so it needs no tests."
            exit 0
          fi
          ANY=$(git ls-files | grep -E "$TESTRE" || true)
          if [ -z "$ANY" ]; then
            echo "::error::This PR changes source files and the repository would still hold no tests."
            exit 1
          fi
          echo "OK: $(echo "$ANY" | wc -l | tr -d ' ') test file(s) present after this PR."
      - name: Refuse runtime dependencies that are not on the allowed list
        env:
          ALLOWED: ${{ inputs.allowed-deps }}
        run: |
          [ -f package.json ] || { echo "No package.json; nothing to check."; exit 0; }
          DEPS=$(jq -r '.dependencies // {} | keys[]' package.json)
          OK=$(printf '%s' "$ALLOWED" | tr ', ' '\n\n' | grep -v '^$' | sort -u)
          BAD=""
          for d in $DEPS; do echo "$OK" | grep -qxF "$d" || BAD="$BAD $d"; done
          if [ -n "$BAD" ]; then
            echo "::error::Runtime dependencies not on the allowed list:$BAD"
            echo "Allowed for this product: ${ALLOWED:-(none)}"
            echo "To allow a package, add it to allowed-deps in this repository's .github/workflows/ci.yml."
            exit 1
          fi
          echo "OK: runtime dependencies are allowed (${DEPS:-none})."

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ inputs.package-manager }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile --ignore-scripts' || 'npm ci --ignore-scripts' }}

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ inputs.package-manager }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile --ignore-scripts' || 'npm ci --ignore-scripts' }}
      - run: ${{ inputs.package-manager }} run typecheck

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ inputs.package-manager }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile --ignore-scripts' || 'npm ci --ignore-scripts' }}
      - run: ${{ inputs.package-manager }} run lint

  unit:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ inputs.package-manager }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile --ignore-scripts' || 'npm ci --ignore-scripts' }}
      - run: ${{ inputs.package-manager }} run test:unit

  isolation:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ inputs.package-manager }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile --ignore-scripts' || 'npm ci --ignore-scripts' }}
      - name: Cross-account data isolation
        run: ${{ inputs.package-manager }} run --if-present test:isolation
      - name: Build
        run: |
          if [ -n "$BUILD_ENV" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              export "$line"
            done <<< "$BUILD_ENV"
          fi
          ${{ inputs.package-manager }} run build
        env:
          BUILD_ENV: ${{ inputs.build-env }}
      - name: Verify build output is real
        run: |
          DIR="${{ inputs.build-dir }}"
          if [ ! -d "$DIR" ]; then
            echo "::error::$DIR does not exist - build produced nothing"
            exit 1
          fi
          COUNT=$(find "$DIR" -type f | wc -l)
          BYTES=$(du -sb "$DIR" | cut -f1)
          echo "Build output: $COUNT files, $BYTES bytes"
          if [ "$COUNT" -lt 5 ] || [ "$BYTES" -lt 10240 ]; then
            echo "::error::$DIR has $COUNT files / $BYTES bytes - too small to be real"
            exit 1
          fi
      - name: Refuse service-role keys in client bundles
        run: |
          SCAN="${{ inputs.scan-dir || inputs.build-dir }}"
          for d in "$SCAN" .expo; do
            [ -d "$d" ] || continue
            grep -rhoE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+' "$d" | sort -u > jwts.txt
            while read -r T; do
              P=$(printf '%s' "$T" | cut -d. -f2 | tr '_-' '/+')
              case $(( ${#P} % 4 )) in 2) P="$P==" ;; 3) P="$P=" ;; esac
              if printf '%s' "$P" | base64 -d 2>/dev/null | grep -q 'service_role'; then
                echo "::error::service_role JWT found in the shipped bundle"
                exit 1
              fi
            done < jwts.txt
            rm -f jwts.txt
            if grep -rqE 'sb_secret_[A-Za-z0-9_-]{10,}' "$d"; then
              echo "::error::A sb_secret_ key is in the shipped bundle."
              exit 1
            fi
          done

  e2e:
    needs: [typecheck, lint, unit, isolation]
    if: inputs.preview_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ inputs.package-manager }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile --ignore-scripts' || 'npm ci --ignore-scripts' }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          BASE_URL: ${{ inputs.preview_url }}

  perf:
    needs: [typecheck, lint, unit, isolation]
    if: inputs.preview_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ inputs.package-manager }}
      - run: ${{ inputs.package-manager == 'pnpm' && 'pnpm install --frozen-lockfile --ignore-scripts' || 'npm ci --ignore-scripts' }}
      - run: ${{ inputs.package-manager }} run perf:check
        env:
          BASE_URL: ${{ inputs.preview_url }}

  automerge:
    # Deliberately not a required check. This job asks GitHub to merge the pull
    # request as soon as every required check passes. The gates still decide:
    # auto-merge waits for them and never bypasses one. If this job fails, the
    # pull request simply stays open for a person to merge.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Ask GitHub to merge this pull request when the checks pass
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ID: ${{ github.event.pull_request.node_id }}
        run: |
          # Call the mutation directly. "gh pr merge --auto" also reads the
          # pull request's commits and their checks, which needs permissions
          # this job does not have, and it fails with "Resource not accessible
          # by integration". The mutation needs only pull-requests: write.
          QUERY='mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{number}}}'
          if OUT=$(gh api graphql -f query="$QUERY" -f id="$PR_ID" 2>&1); then
            echo "Auto-merge is on. This PR merges itself once the five checks pass."
          elif echo "$OUT" | grep -qi "already enabled\|Auto merge is already"; then
            echo "Auto-merge was already on."
          else
            echo "$OUT"
            echo "::warning::Could not turn on auto-merge. Merge this PR by hand."
          fi
